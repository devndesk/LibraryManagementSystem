# ==============================================================================
# 📚 Library Management System (Spring Boot Java Backend Configuration)
# ==============================================================================

# Server Port (Default: 8080)
server.port=8080

# ------------------------------------------------------------------------------
# OPTION 1: SQLite Configuration (ACTIVE DEFAULT)
# Connects directly to the existing library.db so all existing data is preserved!
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:../library.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ------------------------------------------------------------------------------
# OPTION 2: MySQL Configuration (Alternative)
# If you want to use MySQL instead, comment Option 1 above and uncomment below:
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable detailed SQL logging (optional, set to DEBUG to see raw queries)
logging.level.org.springframework.jdbc=INFO
logging.level.com.libmng=DEBUG

# Spring Static Resource Path (Serves public/ folder seamlessly)
spring.web.resources.static-locations=file:../public/,classpath:/static/
